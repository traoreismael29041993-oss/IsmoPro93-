name: Android CI - build AAB/APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build AAB/APK and create release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v2
        with:
          api-level: 36
          build-tools: 36.0.0
          ndk: 25.2.9519653

      - name: Prepare keystore (if provided)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "Writing keystore from secret to my-upload-key.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
          ls -l my-upload-key.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build artifacts
        run: |
          chmod +x ./gradlew
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Keystore provided — building release bundle and apk"
            export STORE_PASSWORD="${{ secrets.STORE_PASSWORD }}"
            export KEY_PASSWORD="${{ secrets.KEY_PASSWORD }}"
            export KEYSTORE_PATH="${{ github.workspace }}/my-upload-key.jks"
            ./gradlew -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" -Pandroid.injected.signing.store.password="$STORE_PASSWORD" -Pandroid.injected.signing.key.alias=upload -Pandroid.injected.signing.key.password="$KEY_PASSWORD" bundleRelease assembleRelease --no-daemon
          else
            echo "No keystore — building debug artifacts"
            ./gradlew bundleDebug assembleDebug --no-daemon
          fi

      - name: List output files
        run: |
          echo "Bundle outputs:"
          ls -R app/build/outputs || true

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: build-${{ github.run_number }}
          release_name: Android build ${{ github.run_number }} (${{ github.ref_name }})
          body: Automated build from commit ${{ github.sha }}
          draft: false
          prerelease: false

      - name: Upload release AAB (release build)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: app/build/outputs/bundle/release/app-release.aab
          asset_name: app-release.aab
          asset_content_type: application/octet-stream

      - name: Upload release APK (release build)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: app/build/outputs/apk/release/app-release.apk
          asset_name: app-release.apk
          asset_content_type: application/vnd.android.package-archive

      - name: Upload debug AAB (no keystore)
        if: ${{ secrets.KEYSTORE_BASE64 == '' }}
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: app/build/outputs/bundle/debug/app-debug.aab
          asset_name: app-debug.aab
          asset_content_type: application/octet-stream

      - name: Upload debug APK (no keystore)
        if: ${{ secrets.KEYSTORE_BASE64 == '' }}
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: app/build/outputs/apk/debug/app-debug.apk
          asset_name: app-debug.apk
          asset_content_type: application/vnd.android.package-archive
